name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build & Test auth-service
        if: hashFiles('auth-service/go.mod') != ''
        run: |
          cd auth-service
          go vet ./...
          go build -v ./cmd/api

      - name: Build & Test account-service
        if: hashFiles('account-service/go.mod') != ''
        run: |
          cd account-service
          go vet ./...
          go build -v ./cmd/api

      - name: Build & Test transaction-service
        if: hashFiles('transaction-service/go.mod') != ''
        run: |
          cd transaction-service
          go vet ./...
          go build -v ./cmd/api

      - name: Build & Test notification-service
        if: hashFiles('notification-service/go.mod') != ''
        run: |
          cd notification-service
          go vet ./...
          go build -v ./cmd/api
