services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: bank-postgres-auth
    environment:
      POSTGRES_USER: aibar
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: auth-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibar -d auth-db"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres-account:
    image: postgres:16-alpine
    container_name: bank-postgres-account
    environment:
      POSTGRES_USER: aibar
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: account-db
    ports:
      - "5433:5432"
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibar -d account-db"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres-transaction:
    image: postgres:16-alpine
    container_name: bank-postgres-transaction
    environment:
      POSTGRES_USER: aibar
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: transaction-db
    ports:
      - "5434:5432"
    volumes:
      - postgres_transaction_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibar -d transaction-db"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres-notification:
    image: postgres:16-alpine
    container_name: bank-postgres-notification
    environment:
      POSTGRES_USER: aibar
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: notification-db
    ports:
      - "5435:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibar -d notification-db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bank-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: bank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'CONTROLLER://:9093,PLAINTEXT://:29092,EXTERNAL://:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bank-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy

  account-service:
    build: ./account-service
    ports:
      - "8082:8082"
    depends_on:
      postgres-account:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  transaction-service:
    build: ./transaction-service
    ports:
      - "8083:8083"
    depends_on:
      postgres-transaction:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_auth_data:
  postgres_account_data:
  postgres_transaction_data:
  postgres_notification_data:
  redis_data:
  kafka_data:
